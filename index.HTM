<head>

  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js">attachAxisRangeListeners();
document.getElementById("individualXAxisMode")?.addEventListener("change",updateDashboard);
</script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js">attachAxisRangeListeners();

  <style>
    :root{--navy:#071d49;--blue:#0047d9;--red:#ff1f1f;--green:#1f9d45;--orange:#f28c28;--border:#d8dee9;--text:#0b1633;--muted:#5c667a;--bg:#f6f8fb;--card:#fff}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}.page{padding:14px;max-width:1800px;margin:0 auto}.topbar{display:grid;grid-template-columns:1fr 1fr 1fr 1.5fr;gap:18px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px 24px;box-shadow:0 2px 8px rgba(10,20,40,.06);margin-bottom:14px;align-items:end;position:sticky;top:0;z-index:20}.control-group{display:flex;flex-direction:column;gap:8px}label{font-weight:700;font-size:15px}select,input[type=file]{height:42px;border:1px solid var(--border);border-radius:6px;background:#fff;padding:0 12px;font-size:15px;color:var(--text)}.options{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;border-left:1px solid var(--border);padding-left:20px}.toggle-row{display:flex;align-items:center;gap:10px;height:42px;font-size:14px}.status{font-size:13px;color:var(--muted)}.run-section{margin-bottom:34px;padding-bottom:18px;border-bottom:2px solid #e8edf5}.run-title{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 18px;margin-bottom:12px;box-shadow:0 2px 8px rgba(10,20,40,.05)}.run-title h2{margin:0;font-size:20px;color:var(--navy)}.run-subtitle{margin-top:4px;font-size:13px;color:var(--muted)}.main-grid{display:grid;grid-template-columns:3fr 1fr;gap:12px}.agg-grid{display:grid;grid-template-columns:2fr 1fr;gap:12px}.plot-card,.metrics-card,.info-card{background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:0 2px 8px rgba(10,20,40,.06);overflow:hidden;margin-bottom:12px}.card-header{background:var(--navy);color:#fff;font-weight:700;font-size:16px;padding:12px 18px;letter-spacing:.2px}.plot{height:430px}.agg-plot{height:650px}.scatter-plot{height:530px}.metrics-card,.info-card{padding:16px}.metrics-title{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700;margin-bottom:18px}.metric-box{border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px;background:#fbfcff}.metric-header{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:17px;margin-bottom:10px}.metric-value{font-size:30px;font-weight:800;margin-bottom:12px}.metric-value.red{color:var(--red)}.metric-value.green{color:var(--green)}.metric-value.orange{color:var(--orange)}.metric-value.blue{color:var(--blue)}.metric-desc{font-size:14px;line-height:1.35;margin-bottom:12px}.metric-detail{display:flex;justify-content:space-between;font-size:13px;margin-top:6px}.qmark{width:24px;height:24px;border-radius:50%;border:1px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);cursor:help;font-size:14px;flex-shrink:0}.empty-state{padding:30px;background:#fff;border:1px solid var(--border);border-radius:8px;color:var(--muted)}.note{color:var(--muted);font-size:13px;margin:8px 0 0 12px}.legend-row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}.legend-swatch{width:22px;height:12px;border-radius:2px;border:1px solid rgba(0,0,0,.08)}@media(max-width:1200px){.topbar{grid-template-columns:1fr;position:static}.options{border-left:none;padding-left:0}.main-grid,.agg-grid{grid-template-columns:1fr}}
  </style>
</head>
<body><div class="page">
  <div class="topbar">
    <div class="control-group"><label>CSV Input</label><input type="file" id="csvFile" accept=".csv"/><div class="status" id="status">Load your master_records.csv file.</div></div>
    <div class="control-group"><label>1) Overview Type</label><select id="overviewType"><option value="Individual">Individual</option><option value="Aggregated">Aggregated</option></select></div>
    <div class="control-group"><label>2) Run Type</label><select id="runType"></select></div>
    <div class="options">
      <div class="control-group"><label>Pace / Speed Display</label><select id="topMetric"><option value="pace_min_km">Pace (min/km)</option><option value="speed_kmh">Speed (km/h)</option></select></div>
      <div class="control-group"><label>Aggregated Display Style</label><select id="distStyle"><option value="box">Box plot</option><option value="violin">Violin plot</option><option value="average">Average point</option></select></div>
      <div class="control-group"><label>Scatter Size</label><select id="scatterSizeMode"><option value="fixed">Fixed</option><option value="distance">Distance</option><option value="time">Time</option></select></div>
      <div class="control-group"><label>Individual Overlay</label><div class="toggle-row"><input type="checkbox" id="overlayToggle"/><span>Overlay HR on pace/speed</span></div></div><div class="control-group"><label>Individual X-axis</label><select id="individualXAxisMode"><option value="elapsed_min">Time-based</option><option value="distance_km">Distance-based</option></select></div>
    </div>
  </div>
  <div id="dashboardContainer"><div class="empty-state">Upload <b>master_records.csv</b> to generate the dashboard.</div></div>
  <div class="note">Aggregated view uses main run types in the dropdown. Split runs are shown as adjacent split elements in Block 1.</div>
</div>
<script>
let allData=[];
const hrDriftTooltip="Heart Rate Drift measures how much your HR changes from the first half to the second half of the selected run.\n\nNegative value = HR decreased in the second half; this can mean warm-up effects, downhill/easier second half, improved pacing, reduced effort, or sensor noise.\n0–5% = excellent aerobic endurance\n5–8% = moderate fatigue\n>8–10% = strong fatigue, dehydration, heat stress, or pacing too hard.";
const aerobicTooltip="Aerobic Efficiency measures how much speed you produce per heartbeat.\n\nCalculated as average speed (km/h) divided by average HR (bpm). Higher values over time = improved aerobic fitness.";
const paceTooltip="Pace Variability measures pacing consistency.\n\n<3% = very controlled pacing\n3–6% = normal variability\n>6% = inconsistent pacing, terrain changes, stop-start running, or fatigue.";
function numeric(v){const x=parseFloat(v);return Number.isFinite(x)?x:null}function safeId(t){return String(t).replace(/[^a-zA-Z0-9_-]/g,"_")}function escapeAttr(t){return String(t).replace(/"/g,"&quot;")}function formatPace(minKm){if(!Number.isFinite(minKm))return"—";const m=Math.floor(minKm);const s=Math.round((minKm-m)*60);return `${m}:${String(s).padStart(2,"0")} min/km`}function formatTime(sec){if(!Number.isFinite(sec))return"—";const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=Math.floor(sec%60);return h>0?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`}function uniqueSorted(v){return[...new Set(v.filter(x=>x!==null&&x!==undefined&&x!==""))].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}))}function mean(a){const c=a.filter(Number.isFinite);return c.length?c.reduce((x,y)=>x+y,0)/c.length:NaN}function std(a){const c=a.filter(Number.isFinite);if(c.length<2)return NaN;const m=mean(c);return Math.sqrt(mean(c.map(x=>(x-m)**2)))}
function prepareData(rows){return rows.map(row=>{const speedMs=numeric(row.speed_m_s),pace=numeric(row.pace_min_km),elapsed=numeric(row.elapsed_sec),distance=numeric(row.distance_km),ts=row.timestamp?new Date(row.timestamp):null;return{...row,run_id:row.run_id,main_run_type:row.main_run_type,segment_type:row.segment_type||row.main_run_type,timestamp_raw:row.timestamp,date:ts&&!isNaN(ts)?ts.toISOString().slice(0,10):row.run_id,elapsed_sec:elapsed,elapsed_min:elapsed!==null?elapsed/60:null,elapsed_label:elapsed!==null?formatTime(elapsed):"—",distance_km:distance,pace_min_km:pace,speed_kmh:speedMs!==null?speedMs*3.6:(pace?60/pace:null),heart_rate_bpm:numeric(row.heart_rate_bpm),power_w:numeric(row.power_w),altitude_m:numeric(row.altitude_m),cadence_label:numeric(row.cadence_label),cadence_spm:numeric(row.cadence_spm),source_file:row.source_file}}).filter(r=>r.run_id&&r.main_run_type&&Number.isFinite(r.elapsed_sec)&&Number.isFinite(r.distance_km))}
function populateRunTypes(){const overview=document.getElementById("overviewType").value;const runTypes=uniqueSorted(allData.map(d=>d.main_run_type));const sel=document.getElementById("runType");sel.innerHTML="";if(overview==="Aggregated"){const o=document.createElement("option");o.value="all";o.textContent="All";sel.appendChild(o)}runTypes.forEach(rt=>{const o=document.createElement("option");o.value=rt;o.textContent=rt;sel.appendChild(o)})}
function topMetricConfig(){const m=document.getElementById("topMetric").value;return m==="speed_kmh"?{key:"speed_kmh",title:"Speed",axisTitle:"Speed (km/h)",hover:"Speed: %{y:.2f} km/h",autorange:true}:{key:"pace_min_km",title:"Pace",axisTitle:"Pace (min/km)",hover:"Pace: %{y:.2f} min/km",autorange:"reversed"}}
function segmentColor(segmentType, idx) {
  const raw = String(segmentType || "").toLowerCase();

  // First segment before "_" is the main run type in split labels like long_MP.
  const main = raw.split("_")[0];

  const mainTypeColors = {
    easy: "rgba(46, 160, 90, 0.78)",
    long: "rgba(0, 88, 210, 0.78)",
    mp: "rgba(220, 60, 60, 0.78)",
    tempo: "rgba(245, 140, 35, 0.78)",
    speed: "rgba(120, 80, 220, 0.78)",
    stride: "rgba(0, 170, 170, 0.78)",
    recovery: "rgba(120, 170, 80, 0.78)"
  };

  const splitTypeColors = {
    easy: "rgba(46, 160, 90, 0.78)",
    mp: "rgba(220, 60, 60, 0.78)",
    tempo: "rgba(245, 140, 35, 0.78)",
    speed: "rgba(120, 80, 220, 0.78)",
    stride: "rgba(0, 170, 170, 0.78)",
    recovery: "rgba(120, 170, 80, 0.78)"
  };

  // For split labels, color by split type, but keep long/easy full-run colors unique.
  if (raw.includes("_")) {
    const split = raw.split("_").slice(1).join("_");
    if (splitTypeColors[split]) return splitTypeColors[split];
  }

  if (mainTypeColors[main]) return mainTypeColors[main];

  const palette = [
    "rgba(50, 100, 220, 0.78)",
    "rgba(46, 160, 90, 0.78)",
    "rgba(220, 60, 60, 0.78)",
    "rgba(245, 140, 35, 0.78)",
    "rgba(120, 80, 220, 0.78)",
    "rgba(0, 170, 170, 0.78)",
    "rgba(180, 100, 40, 0.78)"
  ];
  return palette[idx % palette.length];
}

function segmentShadeColor(st,i){return segmentColor(st,i).replace(".72",".12")}function isExplicitSplitSegment(r){const st=r.segment_type,mt=r.main_run_type;if(!st||st===mt)return false;const l=String(st).toLowerCase();return !(l==="unassigned"||l.endsWith("_unassigned"))}
function getRunIdsForSelectedType(){const t=document.getElementById("runType").value;return uniqueSorted(allData.filter(d=>d.main_run_type===t).map(d=>d.run_id))}function getRunData(id){const t=document.getElementById("runType").value;return allData.filter(d=>d.run_id===id&&d.main_run_type===t).sort((a,b)=>a.elapsed_sec-b.elapsed_sec)}
function getContiguousExplicitSplitSegments(data,xKey){const segs=[];let cur=null;data.forEach(d=>{const x=d[xKey];if(!Number.isFinite(x))return;if(!isExplicitSplitSegment(d)){if(cur){segs.push(cur);cur=null}return}const st=d.segment_type;if(!cur||cur.segment_type!==st){if(cur)segs.push(cur);cur={segment_type:st,x0:x,x1:x}}else cur.x1=x});if(cur)segs.push(cur);return segs.filter(s=>Number.isFinite(s.x0)&&Number.isFinite(s.x1)&&s.x1>s.x0)}function getSegmentShapes(data,xKey){return getContiguousExplicitSplitSegments(data,xKey).map((s,i)=>({type:"rect",xref:"x",yref:"paper",x0:s.x0,x1:s.x1,y0:0,y1:1,fillcolor:segmentShadeColor(s.segment_type,i),line:{width:0},layer:"below"}))}function getSegmentAnnotations(data,xKey){return getContiguousExplicitSplitSegments(data,xKey).map(s=>({x:(s.x0+s.x1)/2,y:1.03,xref:"x",yref:"paper",text:s.segment_type,showarrow:false,font:{size:11,color:"#334"},bgcolor:"rgba(255,255,255,.65)"}))}
function makeStackedPlot(divId,xKey,xTitle,data){const metric=topMetricConfig(),x=data.map(d=>d[xKey]);const t1={x,y:data.map(d=>d[metric.key]),mode:"markers",name:metric.title,type:"scattergl",marker:{size:5,color:"#0047d9"},xaxis:"x",yaxis:"y",customdata:data.map(d=>[d.elapsed_label,d.distance_km,d.segment_type,d.power_w]),hovertemplate:"Time: %{customdata[0]}<br>Distance: %{customdata[1]:.2f} km<br>"+metric.hover+"<br>Segment: %{customdata[2]}<br>Power: %{customdata[3]:.0f} W<extra></extra>"};const t2={x,y:data.map(d=>d.heart_rate_bpm),mode:"markers",name:"❤️ Heart Rate",type:"scattergl",marker:{size:6,color:"#ff1f1f"},xaxis:"x2",yaxis:"y2",customdata:data.map(d=>[d.elapsed_label,d.distance_km,d.segment_type]),hovertemplate:"Time: %{customdata[0]}<br>Distance: %{customdata[1]:.2f} km<br>HR: %{y:.0f} bpm<br>Segment: %{customdata[2]}<extra></extra>"};const layout={height:430,margin:{l:78,r:38,t:28,b:60},paper_bgcolor:"white",plot_bgcolor:"white",showlegend:false,shapes:getSegmentShapes(data,xKey),annotations:getSegmentAnnotations(data,xKey),grid:{rows:2,columns:1,pattern:"independent",roworder:"top to bottom"},xaxis:{showticklabels:false,showgrid:true,gridcolor:"#e7ecf3",zeroline:false},yaxis:{title:{text:metric.axisTitle,font:{color:"#0047d9",size:15}},tickfont:{color:"#0047d9"},autorange:metric.autorange,showgrid:true,gridcolor:"#e7ecf3",zeroline:false,domain:[.56,1]},xaxis2:{title:{text:xTitle,font:{size:15}},showgrid:true,gridcolor:"#e7ecf3",zeroline:false,matches:"x"},yaxis2:{title:{text:"❤️ Heart Rate (bpm)",font:{color:"#ff1f1f",size:15}},tickfont:{color:"#ff1f1f"},showgrid:true,gridcolor:"#e7ecf3",zeroline:false,domain:[0,.44]}};Plotly.newPlot(divId,[t1,t2],layout,{responsive:true,displaylogo:false})}
function makeOverlayPlot(divId,xKey,xTitle,data){const metric=topMetricConfig(),x=data.map(d=>d[xKey]);const t1={x,y:data.map(d=>d[metric.key]),mode:"markers",name:metric.title,type:"scattergl",marker:{size:5,color:"#0047d9"},yaxis:"y"};const t2={x,y:data.map(d=>d.heart_rate_bpm),mode:"markers",name:"❤️ Heart Rate",type:"scattergl",marker:{size:6,color:"#ff1f1f"},yaxis:"y2"};const layout={height:430,margin:{l:78,r:82,t:28,b:60},paper_bgcolor:"white",plot_bgcolor:"white",shapes:getSegmentShapes(data,xKey),annotations:getSegmentAnnotations(data,xKey),legend:{orientation:"h",y:1.1,x:0},xaxis:{title:xTitle,showgrid:true,gridcolor:"#e7ecf3",zeroline:false},yaxis:{title:{text:metric.axisTitle,font:{color:"#0047d9"}},tickfont:{color:"#0047d9"},autorange:metric.autorange,showgrid:true,gridcolor:"#e7ecf3",zeroline:false},yaxis2:{title:{text:"❤️ Heart Rate (bpm)",font:{color:"#ff1f1f"}},tickfont:{color:"#ff1f1f"},overlaying:"y",side:"right",showgrid:false,zeroline:false}};Plotly.newPlot(divId,[t1,t2],layout,{responsive:true,displaylogo:false})}
function computeMetrics(data){const c=data.filter(d=>Number.isFinite(d.distance_km)&&Number.isFinite(d.heart_rate_bpm)&&Number.isFinite(d.pace_min_km)&&Number.isFinite(d.speed_kmh));if(c.length<5)return null;const maxD=Math.max(...c.map(d=>d.distance_km)),minD=Math.min(...c.map(d=>d.distance_km)),mid=minD+(maxD-minD)/2;const first=c.filter(d=>d.distance_km<=mid),second=c.filter(d=>d.distance_km>mid);const hrFirst=mean(first.map(d=>d.heart_rate_bpm)),hrSecond=mean(second.map(d=>d.heart_rate_bpm));const avgSpeed=mean(c.map(d=>d.speed_kmh)),avgHr=mean(c.map(d=>d.heart_rate_bpm));const paceVals=c.map(d=>d.pace_min_km),avgPace=mean(paceVals),paceStd=std(paceVals);return{hrFirst,hrSecond,hrDrift:((hrSecond-hrFirst)/hrFirst)*100,avgSpeed,avgHr,aerobicEfficiency:avgSpeed/avgHr,avgPace,paceStd,paceCv:(paceStd/avgPace)*100}}
function updateMetrics(data,prefix){
  const cleanPace=data.map(d=>d.pace_min_km).filter(Number.isFinite);
  const cleanSpeed=data.map(d=>d.speed_kmh).filter(Number.isFinite);
  const cleanHr=data.map(d=>d.heart_rate_bpm).filter(Number.isFinite);
  const cleanCadence=data.map(d=>d.cadence_spm).filter(Number.isFinite);
  const cadenceLabels=data.map(d=>d.cadence_label).filter(Number.isFinite);

  const avgPace=cleanPace.length?mean(cleanPace):NaN;
  const avgSpeed=cleanSpeed.length?mean(cleanSpeed):NaN;
  const avgHr=cleanHr.length?mean(cleanHr):NaN;
  const avgCadence=cleanCadence.length?mean(cleanCadence):NaN;
  const cadenceLabel=cadenceLabels.length?cadenceLabels[0]:NaN;

  const avgPaceEl=document.getElementById(`${prefix}_avgPace`);
  const avgSpeedEl=document.getElementById(`${prefix}_avgSpeed`);
  const avgHrEl=document.getElementById(`${prefix}_avgHr`);
  const cadenceLabelEl=document.getElementById(`${prefix}_cadenceLabel`);
  const avgCadenceEl=document.getElementById(`${prefix}_avgCadence`);

  if(avgPaceEl) avgPaceEl.textContent=Number.isFinite(avgPace)?formatPace(avgPace):"—";
  if(avgSpeedEl) avgSpeedEl.textContent=Number.isFinite(avgSpeed)?`${avgSpeed.toFixed(2)} km/h`:"—";
  if(avgHrEl) avgHrEl.textContent=Number.isFinite(avgHr)?`${avgHr.toFixed(0)} bpm`:"—";
  if(cadenceLabelEl) cadenceLabelEl.textContent=Number.isFinite(cadenceLabel)?`${cadenceLabel.toFixed(0)} spm`:"—";
  if(avgCadenceEl) avgCadenceEl.textContent=Number.isFinite(avgCadence)?`${avgCadence.toFixed(0)} spm`:"not available";
}

function createRunSection(runId,data){const selectedType=document.getElementById("runType").value,prefix=safeId(`${selectedType}_${runId}`);const dist=Math.max(...data.map(d=>d.distance_km))-Math.min(...data.map(d=>d.distance_km)),dur=Math.max(...data.map(d=>d.elapsed_sec)),segs=uniqueSorted(data.map(d=>d.segment_type)).join(", ");const section=document.createElement("div");section.className="run-section";section.innerHTML=`<div class="run-title"><div><h2>${runId} — ${selectedType}</h2><div class="run-subtitle">${data.length} records · ${dist.toFixed(2)} km · ${formatTime(dur)} · segments: ${segs}</div></div><div class="run-subtitle">${data[0].source_file||""}</div></div><div class="main-grid"><div><div class="plot-card"><div class="card-header" id="${prefix}_analysisHeader">INDIVIDUAL RUN ANALYSIS</div><div id="${prefix}_mainPlot" class="plot"></div></div><div class="inline-axis-card"><div class="inline-axis-title">Axis customization for this run</div><div class="inline-axis-grid"><span class="axis-dark">X-axis</span><input id="${prefix}_xMin" type="number" step="0.1" placeholder="X-min"><input id="${prefix}_xMax" type="number" step="0.1" placeholder="X-max"><span class="axis-blue">Pace/Speed</span><input id="${prefix}_metricYMin" type="number" step="0.1" placeholder="Y-min"><input id="${prefix}_metricYMax" type="number" step="0.1" placeholder="Y-max"><span class="axis-red">HR</span><input id="${prefix}_hrYMin" type="number" step="1" placeholder="Y-min"><input id="${prefix}_hrYMax" type="number" step="1" placeholder="Y-max"><button id="${prefix}_axisAuto" type="button">Auto</button></div></div></div><div class="metrics-card"><div class="metrics-title">Run Summary <span class="qmark" title="Average values are computed from all valid data points in this selected run.">?</span></div><div class="metric-box"><div class="metric-header">Average Pace <span class="qmark" title="Average pace across the selected run. Lower min/km means faster running.">?</span></div><div class="metric-value blue" id="${prefix}_avgPace">—</div><div class="metric-desc">Average pace across the full run.</div></div><div class="metric-box"><div class="metric-header">Average Speed <span class="qmark" title="Average speed across the selected run in km/h. Higher value means faster running.">?</span></div><div class="metric-value green" id="${prefix}_avgSpeed">—</div><div class="metric-desc">Average speed across the full run.</div></div><div class="metric-box"><div class="metric-header">Average Heart Rate <span class="qmark" title="Average heart rate across the selected run in beats per minute.">?</span></div><div class="metric-value red" id="${prefix}_avgHr">—</div><div class="metric-desc">Average cardiovascular load.</div></div><div class="metric-box"><div class="metric-header">Cadence <span class="qmark" title="Cadence value from the file name, stored as cadence_label in the parsed data. If available, measured cadence is also averaged from the FIT file.">?</span></div><div class="metric-value orange" id="${prefix}_cadenceLabel">—</div><div class="metric-desc">Cadence label from file name.</div><div class="metric-detail"><span>Measured avg cadence</span><span id="${prefix}_avgCadence">—</span></div></div></div></div>`;return{section,prefix}}
function setupInlineIndividualAxisControls(prefix, plotDivId) {
  const ids = {
    xMin: `${prefix}_xMin`,
    xMax: `${prefix}_xMax`,
    metricYMin: `${prefix}_metricYMin`,
    metricYMax: `${prefix}_metricYMax`,
    hrYMin: `${prefix}_hrYMin`,
    hrYMax: `${prefix}_hrYMax`,
    auto: `${prefix}_axisAuto`
  };

  function getRange(minId, maxId) {
    const minEl = document.getElementById(minId);
    const maxEl = document.getElementById(maxId);
    if (!minEl || !maxEl) return null;

    const minVal = parseFloat(minEl.value);
    const maxVal = parseFloat(maxEl.value);

    if (Number.isFinite(minVal) && Number.isFinite(maxVal) && minVal < maxVal) {
      return [minVal, maxVal];
    }

    return null;
  }

  function applyRanges() {
    const update = {};

    const xRange = getRange(ids.xMin, ids.xMax);
    if (xRange) {
      update["xaxis.range"] = xRange;
      update["xaxis.autorange"] = false;
      update["xaxis2.range"] = xRange;
      update["xaxis2.autorange"] = false;
    }

    const metricRange = getRange(ids.metricYMin, ids.metricYMax);
    if (metricRange) {
      update["yaxis.range"] = metricRange;
      update["yaxis.autorange"] = false;
    }

    const hrRange = getRange(ids.hrYMin, ids.hrYMax);
    if (hrRange) {
      update["yaxis2.range"] = hrRange;
      update["yaxis2.autorange"] = false;
    }

    if (Object.keys(update).length) {
      Plotly.relayout(plotDivId, update);
    }
  }

  [ids.xMin, ids.xMax, ids.metricYMin, ids.metricYMax, ids.hrYMin, ids.hrYMax].forEach(id => {
    const el = document.getElementById(id);

function scatterMarkerSizes(data){const mode=document.getElementById("scatterSizeMode").value;if(mode==="fixed")return data.map(_=>6);const vals=data.map(d=>mode==="distance"?d.distance_km:d.elapsed_min).filter(Number.isFinite);const minV=Math.min(...vals),maxV=Math.max(...vals);return data.map(d=>{const v=mode==="distance"?d.distance_km:d.elapsed_min;if(!Number.isFinite(v)||maxV===minV)return 7;return 5+12*((v-minV)/(maxV-minV))})}

function getRunDistanceItems(data) {
  const groups = {};

  data.forEach(d => {
    if (!groups[d.run_id]) groups[d.run_id] = [];
    groups[d.run_id].push(d);
  });

  const runItems = [];

  Object.entries(groups).forEach(([runId, rows]) => {
    rows.sort((a, b) => a.elapsed_sec - b.elapsed_sec);

    const first = rows[0];
    const date = first.date || runId;

    const segGroups = {};
    rows.forEach(r => {
      const label = isExplicitSplitSegment(r) ? r.segment_type : r.main_run_type;
      if (!segGroups[label]) segGroups[label] = [];
      segGroups[label].push(r);
    });

    const segments = Object.entries(segGroups).map(([label, segRows]) => {
      const distances = segRows.map(r => r.distance_km).filter(Number.isFinite);
      if (!distances.length) return null;
      const dMin = Math.min(...distances);
      const dMax = Math.max(...distances);
      return {
        label,
        distance: Math.max(0, dMax - dMin)
      };
    }).filter(s => s && s.distance > 0);

    runItems.push({
      run_id: runId,
      date,
      source_file: first.source_file || "",
      segments
    });
  });

  runItems.sort((a, b) => {
    const dateCompare = String(a.date).localeCompare(String(b.date), undefined, {numeric: true});
    if (dateCompare !== 0) return dateCompare;
    return String(a.run_id).localeCompare(String(b.run_id), undefined, {numeric: true});
  });

  return runItems;
}


const axisRanges = {};

function readAxisRangeFromMemory(divId, axisKey) {
  if (!axisRanges[divId] || !axisRanges[divId][axisKey]) return null;
  const r = axisRanges[divId][axisKey];
  if (Number.isFinite(r.min) && Number.isFinite(r.max) && r.min < r.max) {
    return [r.min, r.max];
  }
  return null;
}

function applyAxisRanges(divId, axisSpecs) {
  const update = {};

  axisSpecs.forEach(spec => {
    const range = readAxisRangeFromMemory(divId, spec.axis);
    if (range) {
      update[`${spec.axis}.range`] = range;
      update[`${spec.axis}.autorange`] = false;
    }
  });

  if (Object.keys(update).length) {
    Plotly.relayout(divId, update);
  }
}

function addAxisControls(divId, axisSpecs) {
  const plotDiv = document.getElementById(divId);
  if (!plotDiv) return;

  const card = plotDiv.closest(".plot-card");
  if (!card) return;

  card.querySelectorAll(`[data-axis-control-for="${divId}"]`).forEach(el => el.remove());

  const gear = document.createElement("button");
  gear.className = "axis-gear";
  gear.innerHTML = "⚙";
  gear.title = "Axis range settings";
  gear.setAttribute("data-axis-control-for", divId);

  const pop = document.createElement("div");
  pop.className = "axis-control-popover";
  pop.setAttribute("data-axis-control-for", divId);

  const title = document.createElement("div");
  title.className = "axis-control-title";
  title.textContent = "Axis settings";
  pop.appendChild(title);

  axisSpecs.forEach(spec => {
    const row = document.createElement("div");
    row.className = "axis-control-row";

    const label = document.createElement("span");
    label.textContent = spec.label;
    label.className = spec.className || "";

    const minInput = document.createElement("input");
    minInput.type = "number";
    minInput.step = spec.step || "0.1";
    minInput.placeholder = "min";

    const maxInput = document.createElement("input");
    maxInput.type = "number";
    maxInput.step = spec.step || "0.1";
    maxInput.placeholder = "max";

    const current = axisRanges[divId] && axisRanges[divId][spec.axis];
    if (current) {
      if (Number.isFinite(current.min)) minInput.value = current.min;
      if (Number.isFinite(current.max)) maxInput.value = current.max;
    }

    function updateRange() {
      const minVal = parseFloat(minInput.value);
      const maxVal = parseFloat(maxInput.value);

      if (!axisRanges[divId]) axisRanges[divId] = {};
      axisRanges[divId][spec.axis] = {
        min: Number.isFinite(minVal) ? minVal : null,
        max: Number.isFinite(maxVal) ? maxVal : null
      };

      const range = readAxisRangeFromMemory(divId, spec.axis);
      const update = {};

      if (range) {
        update[`${spec.axis}.range`] = range;
        update[`${spec.axis}.autorange`] = false;
      }

      if (Object.keys(update).length) {
        Plotly.relayout(divId, update);
      }
    }

    ["input", "change"].forEach(evt => {
      minInput.addEventListener(evt, updateRange);
      maxInput.addEventListener(evt, updateRange);
    });

    row.appendChild(label);
    row.appendChild(minInput);
    row.appendChild(maxInput);
    pop.appendChild(row);
  });

  const actions = document.createElement("div");
  actions.className = "axis-control-actions";

  const autoBtn = document.createElement("button");
  autoBtn.textContent = "Auto";
  autoBtn.onclick = () => {
    delete axisRanges[divId];
    const update = {};
    axisSpecs.forEach(spec => {
      update[`${spec.axis}.autorange`] = true;
    });
    Plotly.relayout(divId, update);
    addAxisControls(divId, axisSpecs);
  };

  const closeBtn = document.createElement("button");
  closeBtn.textContent = "Close";
  closeBtn.onclick = () => pop.classList.remove("open");

  actions.appendChild(autoBtn);
  actions.appendChild(closeBtn);
  pop.appendChild(actions);

  gear.onclick = () => pop.classList.toggle("open");

  card.appendChild(gear);
  card.appendChild(pop);

  applyAxisRanges(divId, axisSpecs);
}

function makeAllRunDistanceBars(divId, data) {
  const runItems = getRunDistanceItems(data);

  // Build one stacked bar per run.
  // Each segment type becomes one trace, with y values aligned by run.
  const allSegmentLabels = uniqueSorted(
    runItems.flatMap(run => run.segments.map(seg => seg.label))
  );

  const xVals = runItems.map((run, idx) => idx);
  const tickText = runItems.map(run => run.date);

  const traces = allSegmentLabels.map((label, labelIdx) => {
    const yVals = runItems.map(run => {
      const seg = run.segments.find(s => s.label === label);
      return seg ? seg.distance : 0;
    });

    return {
      x: xVals,
      y: yVals,
      type: "bar",
      name: label,
      marker: {color: segmentColor(label, labelIdx)},
      customdata: runItems.map(run => {
        const seg = run.segments.find(s => s.label === label);
        return [
          run.run_id,
          run.date,
          label,
          run.source_file,
          seg ? seg.distance : 0
        ];
      }),

  });

  // Add total distance labels above each stacked bar.
  const totals = runItems.map(run =>
    run.segments.reduce((sum, seg) => sum + seg.distance, 0)

  const totalLabelTrace = {
    x: xVals,
    y: totals,
    mode: "text",

    text: totals.map(v => v.toFixed(1)),

    yaxis: "y"

  // Cadence label from parsed file: one purple diamond point per run on right y-axis.
  const cadenceVals = runItems.map(run => {
    const rows = data.filter(d => d.run_id === run.run_id);

        return d.run_id === run.run_id && label === seg.label;
      });

      const speeds = rows.map(d => d.speed_kmh).filter(Number.isFinite);

      }

    });
  });

  const avgSpeedTrace = {

    mode: "markers",

    name: "Average speed",
    marker: {

  Plotly.newPlot(divId, [...traces, totalLabelTrace, cadenceTrace, avgSpeedTrace], layout, {responsive: true, displaylogo: false});

          </div>
        </div>

        <div class="plot-card">
          <div class="card-header">HEART RATE vs PACE/SPEED — ALL DATA POINTS</div>
          <div id="aggScatter" class="scatter-plot"></div>
          <div class="note">
            Each point is one timestamp-level datapoint. Color = heart rate using blue → yellow → red.
          </div>
        </div>
      </div>`;
  } else {
    c.innerHTML=`
      <div class="agg-grid">
        <div>
          <div class="plot-card">
            <div class="card-header">BLOCK 1: PROGRESSION OVER TIME — PER RUN / PER SPLIT</div>
            <div id="aggProgress" class="agg-plot"></div><div class="note">In Average point mode, points are connected with lines to show progression over dates/runs. Use the ⚙ axis settings to control X/Y ranges.</div>
          </div>
        </div>
        <div>
          <div class="plot-card">
            <div class="card-header">BLOCK 2: HEART RATE vs PACE/SPEED — ${runType}</div>
            <div id="aggScatter" class="scatter-plot"></div>
          </div>
          <div class="info-card">
            <div class="metrics-title">How to read splits</div>
            <p>If a run has split sections, each split appears next to the others from the same run/date.</p>
            <p>This applies to the distance bars and the pace/HR box, violin, or average-point views.</p>
          </div>
        </div>
      </div>`;
  }
}

function updateAggregatedDashboard(){
  const rt=document.getElementById("runType").value;
  const data=rt==="all"?allData:allData.filter(d=>d.main_run_type===rt);

  createAggregatedLayout(rt);
  attachAxisRangeListeners();

  if(!data.length){
    document.getElementById("dashboardContainer").innerHTML='<div class="empty-state">No data found.</div>';
    return;
  }

  if(rt==="all"){
    attachAxisRangeListeners();
    makeAllRunDistanceBars("allDistanceBars",data);
  } else {
    makeAggregatedProgress("aggProgress",data);
  }

  makePaceHrScatter("aggScatter",data,rt==="all"?"All runs":`Run type: ${rt}`);
  attachAxisRangeListeners();

  if(typeof activateQuestionMarkTooltips === "function"){
    activateQuestionMarkTooltips();
  }

  document.getElementById("status").textContent=`${data.length} datapoints shown in aggregated view.`;
}


function updateIndividualXAxisControlVisibility(){
  const box=document.getElementById("individualXAxisMode")?.closest(".control-group");
  if(!box)return;
  const isIndividual=document.getElementById("overviewType").value==="Individual";
  box.style.opacity=isIndividual?"1":"0.45";
  box.style.pointerEvents=isIndividual?"auto":"none";
}

function updateDashboard(){updateIndividualXAxisControlVisibility();if(!allData.length)return;const overview=document.getElementById("overviewType").value;if(overview==="Individual"){if(document.getElementById("runType").value==="all")populateRunTypes();updateIndividualDashboard()}else{updateAggregatedDashboard()}}
document.getElementById("csvFile").addEventListener("change",e=>{const file=e.target.files[0];if(!file)return;Papa.parse(file,{header:true,dynamicTyping:false,skipEmptyLines:true,complete:res=>{allData=prepareData(res.data||[]);if(!allData.length){document.getElementById("status").textContent="No valid rows found.";return}populateRunTypes();updateDashboard()}})});document.getElementById("overviewType").addEventListener("change",()=>{populateRunTypes();updateDashboard()});["runType","overlayToggle","topMetric","distStyle","scatterSizeMode","individualXAxisMode"].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener("change",updateDashboard)});updateIndividualXAxisControlVisibility();
attachAxisRangeListeners();
</script></body></html>
